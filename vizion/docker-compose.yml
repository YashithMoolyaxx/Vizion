services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  django:
    build: ./backend
    env_file: .env
    command: sh -c "python manage.py migrate && if [ \"$SEED_DEMO\" = \"1\" ]; then python manage.py seed_demo; fi && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build: ./backend
    env_file: .env
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    depends_on:
      - django
      - redis

  celery-beat:
    build: ./backend
    env_file: .env
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      - django
      - redis

  frontend:
    build: ./frontend

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - django
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
